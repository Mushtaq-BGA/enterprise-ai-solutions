---
# =============================================================================
# NFS Storage — Teardown
# =============================================================================

- name: "nfs_storage | Check if Helm release exists"
  kubernetes.core.helm_info:
    name: nfs-subdir-external-provisioner
    release_namespace: "{{ nfs_provisioner_namespace }}"
  register: _nfs_release
  failed_when: false

- name: "nfs_storage | Compute teardown-needed flag"
  ansible.builtin.set_fact:
    _nfs_release_present: "{{ (_nfs_release.status | default({}) | length) > 0 }}"

- name: "nfs_storage | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "NFS provisioner Helm release not found. Nothing to tear down."
  when: not _nfs_release_present

- name: "nfs_storage | Resolve NFS server target"
  ansible.builtin.set_fact:
    _nfs_target: >-
      {%- if groups['nfs_server'] | default([]) | length > 0 -%}
        {{ groups['nfs_server'] | first }}
      {%- elif groups['kube_control_plane'] | default([]) | length > 0 -%}
        {{ groups['kube_control_plane'] | first }}
      {%- else -%}
        localhost
      {%- endif -%}

- name: "nfs_storage | Teardown"
  when: _nfs_release_present
  block:

    - name: "nfs_storage | Uninstall Helm release"
      kubernetes.core.helm:
        name: nfs-subdir-external-provisioner
        release_namespace: "{{ nfs_provisioner_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    - name: "nfs_storage | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ nfs_provisioner_namespace }}"
        state: absent
      failed_when: false

    - name: "nfs_storage | Remove NFS export on server"
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: "^{{ nfs_path | regex_escape }}\\s"
        state: absent
      delegate_to: "{{ _nfs_target | trim }}"
      become: true
      failed_when: false
      when: nfs_server | default('', true) | length > 0

    - name: "nfs_storage | Re-export after removal"
      ansible.builtin.command: exportfs -ra
      delegate_to: "{{ _nfs_target | trim }}"
      become: true
      changed_when: true
      failed_when: false
      when: nfs_server | default('', true) | length > 0

    - name: "nfs_storage | Teardown complete"
      ansible.builtin.debug:
        msg:
          - "NFS provisioner removed."
          - "NFS export removed from {{ _nfs_target | trim }}:/etc/exports."
          - "Data at {{ nfs_server | default('') | trim }}:{{ nfs_path }} is preserved (manual cleanup if needed)."
