---
# =============================================================================
# MinIO Role Defaults
# =============================================================================
# Deploys standalone MinIO as an S3-compatible object store.
#
# This role sets the provider-agnostic object_store_* variables on completion
# so that consumers (Loki, Tempo, …) never reference minio_* directly.
# To migrate to a different backend, swap object_store_backend in global_config
# and add the new role — zero changes required in consumer roles.
# =============================================================================

minio_namespace: "minio"

# ── Helm repo ─────────────────────────────────────────────────────────────────
minio_helm_repo: "https://charts.min.io/"

# ── Chart version ─────────────────────────────────────────────────────────────
# minio 5.4.0 → MinIO RELEASE.2024-12-18T13-15-44Z
minio_chart_version: "5.4.0"

# ── Root credentials (admin only — never used by services) ────────────────────
# Password is managed by tasks/credentials.yaml — generated on first install,
# stored in the 'minio-credentials' K8s Secret, reloaded on subsequent runs.
minio_root_user: "minioadmin"
minio_root_password: ""

# ── Storage ───────────────────────────────────────────────────────────────────
minio_storage_size: "100Gi"

# ── Service ports ─────────────────────────────────────────────────────────────
minio_api_port: 9000
minio_console_port: 9001

# ── Internal service URL (private — do not reference outside this role) ───────
_minio_endpoint: "http://minio.{{ minio_namespace }}.svc.cluster.local:{{ minio_api_port }}"
