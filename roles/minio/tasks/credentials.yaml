---
# =============================================================================
# MinIO — Credential bootstrap
# Pattern: K8s Secret is source of truth.
#   First run:  generate → deploy → store in Secret
#   Subsequent: read from Secret → deploy (idempotent, same passwords)
# =============================================================================

- name: "minio | credentials | Check for existing credentials Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: minio-credentials
    namespace: "{{ minio_namespace }}"
  register: _minio_creds_secret
  failed_when: false

- name: "minio | credentials | Load passwords from existing Secret"
  ansible.builtin.set_fact:
    minio_root_password: "{{ _minio_creds_secret.resources[0].data.rootPassword | b64decode }}"
    object_store_loki_secret_key: "{{ _minio_creds_secret.resources[0].data.lokiSecretKey | b64decode }}"
    object_store_tempo_secret_key: "{{ _minio_creds_secret.resources[0].data.tempoSecretKey | b64decode }}"
  when: (_minio_creds_secret.resources | default([])) | length > 0

- name: "minio | credentials | Generate new passwords (first install)"
  ansible.builtin.set_fact:
    minio_root_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    object_store_loki_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    object_store_tempo_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: (_minio_creds_secret.resources | default([])) | length == 0

- name: "minio | credentials | Store credentials Secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: minio-credentials
        namespace: "{{ minio_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/component: object-store
      type: Opaque
      stringData:
        rootUser: "{{ minio_root_user }}"
        rootPassword: "{{ minio_root_password }}"
        endpoint: "{{ _minio_endpoint }}"
        lokiAccessKey: "{{ object_store_loki_access_key }}"
        lokiSecretKey: "{{ object_store_loki_secret_key }}"
        tempoAccessKey: "{{ object_store_tempo_access_key }}"
        tempoSecretKey: "{{ object_store_tempo_secret_key }}"
