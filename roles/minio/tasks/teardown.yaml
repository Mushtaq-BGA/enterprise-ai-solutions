---
# =============================================================================
# MinIO — Teardown
# =============================================================================

- name: "minio | Check if Helm release exists"
  kubernetes.core.helm_info:
    name: minio
    release_namespace: "{{ minio_namespace }}"
  register: _minio_release
  failed_when: false

- name: "minio | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "MinIO Helm release not found in {{ minio_namespace }}. Nothing to tear down."
  when: _minio_release.status is not defined

- name: "minio | Teardown"
  when: _minio_release.status is defined
  block:
    - name: "minio | Uninstall Helm release"
      kubernetes.core.helm:
        name: minio
        release_namespace: "{{ minio_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    - name: "minio | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ minio_namespace }}"
        state: absent
      failed_when: false
