---
# =============================================================================
# MinIO — Validate
# =============================================================================

- name: "minio | Check Helm release"
  kubernetes.core.helm_info:
    name: minio
    release_namespace: "{{ minio_namespace }}"
  register: _minio_release

- name: "minio | Assert MinIO is installed"
  ansible.builtin.assert:
    that: _minio_release.status is defined
    fail_msg: "MinIO is not installed in namespace {{ minio_namespace }}"
    success_msg: "MinIO Helm release found"

- name: "minio | Check MinIO Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: minio
    namespace: "{{ minio_namespace }}"
  register: _minio_deploy

- name: "minio | Assert MinIO has ready replicas"
  ansible.builtin.assert:
    that:
      - _minio_deploy.resources | length > 0
      - (_minio_deploy.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "MinIO Deployment has no ready replicas"
    success_msg: "MinIO ready ({{ _minio_deploy.resources[0].status.readyReplicas | default(0) }} replicas)"

- name: "minio | Validation passed"
  ansible.builtin.debug:
    msg: "MinIO validation passed. Endpoint: {{ _minio_endpoint }}"
