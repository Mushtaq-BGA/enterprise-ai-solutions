name: "Trivy Scan"
on:
  workflow_dispatch:
    inputs:
      PR_number:
        description: 'Pull request number'
        required: true
  push:
    branches:
      - main
      - v1.0
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  Trivy-scan:
    runs-on: innersource.prod.amr.dind
    name: Trivy Scan
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Trivy vulnerability scanner (JSON)
        uses: intel-innersource/frameworks.actions.trivy@v1
        with:
          TRIVY_REPORT_FORMAT: 'json'
          TRIVY_SCAN_TYPE: 'fs'
          TRIVY_SCAN_PATH: '.'
          TRIVY_EXIT_CODE: '0'
          TRIVY_VULN_TYPE: 'os,library'
          TRIVY_SEVERITY: 'CRITICAL,HIGH'
          TRIVY_CUSTOM_PARAMS: "--scanners vuln,secret,license,misconfig --skip-dirs venv --output trivy-report.json"

      - name: Run Trivy vulnerability scanner (Table)
        uses: intel-innersource/frameworks.actions.trivy@v1
        with:
          TRIVY_REPORT_FORMAT: 'table'
          TRIVY_SCAN_TYPE: 'fs'
          TRIVY_SCAN_PATH: '.'
          TRIVY_EXIT_CODE: '0'
          TRIVY_VULN_TYPE: 'os,library'
          TRIVY_SEVERITY: 'CRITICAL,HIGH'
          TRIVY_CUSTOM_PARAMS: "--scanners vuln,secret,license,misconfig --skip-dirs venv --output trivy-report.txt"

      - name: Upload Trivy scan reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-reports
          path: |
            trivy-report.json
            trivy-report.txt
            trivy-report.sarif
          retention-days: 30

      - name: Scan project for secrets and misconfigurations
        uses: intel-innersource/frameworks.actions.trivy@v1
        with:
          TRIVY_REPORT_FORMAT: 'table'
          TRIVY_SCAN_TYPE: 'fs'
          TRIVY_SCAN_PATH: '.'
          TRIVY_EXIT_CODE: '0'
          TRIVY_SEVERITY: 'CRITICAL,HIGH'
          TRIVY_CUSTOM_PARAMS: "--scanners secret,misconfig --skip-dirs venv --output trivy-secrets-report.txt"

      - name: Upload secrets scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-secrets-report
          path: trivy-secrets-report.txt
          retention-days: 30 
